[package]
name = "fabricaot-desktop"
version = "0.2.93"
description = "Native Craft Launcher local modpack and build workspace"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "fabricaot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
local-testing = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSpace"] }
