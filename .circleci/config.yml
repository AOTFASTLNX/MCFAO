version: 2.1

# Opt in manually to avoid spending macOS build credits on normal pushes.
parameters:
  run_check:
    type: boolean
    default: false
  run_toolchain:
    type: boolean
    default: false

jobs:
  check_aot_mac:
    macos:
      xcode: "27.1.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Verify Apple Silicon and AOT toolchain prerequisites
          command: |
            set -eu
            echo "=== Architecture ==="
            uname -m
            test "$(uname -m)" = "arm64"

            echo "=== Physical RAM (bytes) ==="
            sysctl -n hw.memsize

            echo "=== macOS ==="
            sw_vers

            echo "=== Xcode ==="
            xcodebuild -version

            echo "=== Available disk ==="
            df -h .

            echo "=== Java (optional for first check) ==="
            if command -v java >/dev/null 2>&1; then
              java -version
            else
              echo "Java not installed; will configure for the AOT build."
            fi

            echo "=== GraalVM Native Image (optional for first check) ==="
            if command -v native-image >/dev/null 2>&1; then
              native-image --version
            else
              echo "native-image not installed; will configure for the AOT build."
            fi

  check_graalvm25:
    macos:
      xcode: "27.1.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Verify locked Java 25 and iOS SDK prerequisites
          no_output_timeout: 15m
          command: |
            set -eu
            test "$(uname -m)" = "arm64"

            echo "=== Python ==="
            python3 --version
            python3 -c 'import sys; assert sys.version_info >= (3, 11, 8), "Requires Python 3.11.8+ for safe tar extraction"'

            echo "=== Xcode and iPhoneOS SDK ==="
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --find clang

            echo "=== Pinned GraalVM CE 25.0.2 download and SHA-256 verification ==="
            python3 -B tools/bootstrap_toolchain.py

            GRAALVM_HOME="$PWD/.cache/toolchains/graalvm-25.0.2/graalvm-community-openjdk-25.0.2+10.1/Contents/Home"
            test -x "$GRAALVM_HOME/bin/java"
            test -x "$GRAALVM_HOME/bin/native-image"

            echo "=== Pinned GraalVM Java ==="
            "$GRAALVM_HOME/bin/java" -version
            echo "=== Pinned Native Image ==="
            "$GRAALVM_HOME/bin/native-image" --version

            echo "=== Java major version ==="
            "$GRAALVM_HOME/bin/java" -version 2>&1 | grep -E 'version "25\.|openjdk 25\.'

            echo "=== Remaining disk ==="
            df -h .

workflows:
  manual_check:
    when: << pipeline.parameters.run_check >>
    jobs:
      - check_aot_mac
  manual_toolchain:
    when: << pipeline.parameters.run_toolchain >>
    jobs:
      - check_graalvm25
